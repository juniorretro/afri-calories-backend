services:
  - type: web
    name: vitaflow-api
    runtime: node
    plan: free
    buildCommand: npm install && chmod +x ./node_modules/.bin/prisma && npm run build
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ALLOWED_ORIGINS
        sync: false
